<header class="page-header">
  <h1>Contact Us</h1>
  <p class="breadcrumb">Home / Contact</p>
</header>

<section class="section">
  <div class="container contact-grid">
    <div class="contact-info-card reveal">
      <h3>Get in Touch</h3>
      <div class="contact-item"><span class="ic">📍</span><span data-shop-address></span></div>
      <div class="contact-item"><span class="ic">📞</span><span data-shop-phone></span></div>
      <div class="contact-item"><span class="ic">💬</span><span>WhatsApp: <span data-shop-phone></span></span></div>
      <div class="contact-item"><span class="ic">✉️</span><span data-shop-email></span></div>
      <div class="contact-item"><span class="ic">🕒</span><span data-shop-hours></span></div>
      <div class="contact-actions">
        <a href="#" data-call class="btn btn-gold">Click to Call</a>
        <a href="#" data-whatsapp="1" class="btn btn-whatsapp">WhatsApp Chat</a>
      </div>
    </div>

    <div class="form-card reveal">
      <h3 style="margin-bottom:20px;">Send Us an Enquiry</h3>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required minlength="2" />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required minlength="7" />
        </div>
        <div class="form-group">
          <label for="email">Email (optional)</label>
          <input type="email" id="email" name="email" />
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="4" required minlength="5"></textarea>
        </div>
        <button type="submit" class="btn btn-gold" style="width:100%;">Send Enquiry</button>
        <p class="form-msg" id="formMsg"></p>
      </form>
    </div>
  </div>
</section>

<section class="section" style="background:var(--white);">
  <div class="container">
    <h2 class="section-title reveal">Find Us</h2>
    <div class="divider"></div>
    <p class="section-subtitle reveal">Visit our showroom — we'd love to welcome you.</p>
    <div class="map-wrap reveal">
      <iframe id="shopMap" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </div>
</section>

<footer id="siteFooter"></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
<script>
  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msgEl = document.getElementById("formMsg");
    msgEl.className = "form-msg";
    msgEl.textContent = "";

    const payload = {
      name: document.getElementById("name").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      email: document.getElementById("email").value.trim() || null,
      message: document.getElementById("message").value.trim(),
    };

    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    try {
      await apiRequest("/api/contact", { method: "POST", body: JSON.stringify(payload) });
      msgEl.classList.add("success");
      msgEl.textContent = "Thank you! Your enquiry has been sent. We'll get back to you shortly.";
      e.target.reset();
    } catch (err) {
      msgEl.classList.add("error");
      msgEl.textContent = err.message || "Something went wrong. Please try again or WhatsApp us directly.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Enquiry";
    }
  });
</script>
<script src="assets/js/footer-loader.js"></script>
</body>
</html>
