<script>
  let activeCategory = "";
  let searchTerm = "";

  function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  async function loadCategories() {
    const filtersEl = document.getElementById("filters");
    try {
      const categories = await apiRequest("/api/categories");
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = "filter-btn";
        btn.dataset.slug = cat.slug;
        btn.textContent = cat.name;
        btn.addEventListener("click", () => {
          activeCategory = cat.slug;
          document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadProducts();
        });
        filtersEl.appendChild(btn);
      });

      const preselect = getQueryParam("category");
      if (preselect) {
        const match = filtersEl.querySelector(`[data-slug="${preselect}"]`);
        if (match) {
          activeCategory = preselect;
          document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
          match.classList.add("active");
        }
      }
    } catch (err) {
      console.error(err);
    }
  }

  document.querySelector('[data-slug=""]').addEventListener("click", (e) => {
    activeCategory = "";
    document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
    e.target.classList.add("active");
    loadProducts();
  });

  async function loadProducts() {
    const grid = document.getElementById("productGrid");
    grid.innerHTML = '<p class="loading-text">Loading jewellery collection…</p>';
    try {
      const params = new URLSearchParams({ active_only: "true" });
      if (activeCategory) params.set("category_slug", activeCategory);
      if (searchTerm) params.set("search", searchTerm);
      const products = await apiRequest(`/api/products?${params.toString()}`);
      if (!products.length) {
        grid.innerHTML = '<p class="empty-state">No jewellery found. Try a different search or category.</p>';
        return;
      }
      grid.innerHTML = products.map(productCardHTML).join("");
      initScrollAnimations();
    } catch (err) {
      grid.innerHTML = `<p class="empty-state">Unable to load collection. ${escapeHTML(err.message)}</p>`;
    }
  }

  document.getElementById("searchBtn").addEventListener("click", () => {
    searchTerm = document.getElementById("searchInput").value.trim();
    loadProducts();
  });
  document.getElementById("searchInput").addEventListener("keyup", (e) => {
    if (e.key === "Enter") {
      searchTerm = e.target.value.trim();
      loadProducts();
    }
  });

  loadCategories().then(loadProducts);
</script>
